<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FullRAG AI</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">

    <style>
        :root {
            --bg-color: #f0f4f9; /* Gemini 风格浅灰背景 */
            --chat-bg: #ffffff;
            --primary-color: #4c8bf5; /* 谷歌蓝 */
            --gradient-start: #4c8bf5;
            --gradient-end: #d96570; /* Gemini 渐变红 */
            --text-primary: #1f1f1f;
            --text-secondary: #5f6368;
            --bubble-user: #e8f0fe;
            --border-radius: 24px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.12);
            --shadow-float: 0 6px 16px rgba(0,0,0,0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 顶部导航 */
        .navbar {
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: transparent;
            z-index: 100;
        }

        .logo {
            font-size: 20px;
            font-weight: 600;
            background: linear-gradient(90deg, var(--gradient-start), var(--gradient-end));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-badge {
            font-size: 12px;
            padding: 4px 12px;
            background: rgba(255,255,255,0.8);
            border-radius: 20px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: var(--shadow-sm);
        }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #ddd; }
        .dot.active { background: #34a853; box-shadow: 0 0 4px #34a853; }

        /* 聊天区域 */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            scroll-behavior: smooth;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .chat-content {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            padding-bottom: 120px; /* 为底部输入框留空 */
        }

        /* 欢迎屏幕 */
        .welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 80%;
            text-align: center;
            animation: fadeIn 0.5s ease;
        }

        .welcome-title {
            font-size: 48px;
            font-weight: 500;
            margin-bottom: 16px;
            background: linear-gradient(90deg, #4285f4, #9b72cb, #d96570);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        .suggestion-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 40px;
            width: 100%;
            max-width: 600px;
        }

        .suggestion-card {
            background: #fff;
            padding: 16px;
            border-radius: 12px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
            box-shadow: var(--shadow-sm);
            font-size: 14px;
            color: var(--text-secondary);
        }

        .suggestion-card:hover {
            background: #f8fafd;
            border-color: #dbe4f7;
            transform: translateY(-2px);
        }

        /* 消息样式 */
        .message-row {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
            width: 100%;
            animation: slideUp 0.3s ease;
        }

        .message-row.user {
            flex-direction: row-reverse;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            background: #fff;
            box-shadow: var(--shadow-sm);
        }
        
        .avatar span { font-size: 18px; }

        .message-bubble {
            max-width: 85%;
            line-height: 1.6;
            font-size: 15px;
            position: relative;
            width: fit-content;
        }

        .message-row.user .message-bubble,
        .message-row.assistant .message-bubble {
            background: transparent;
            padding: 0;
            color: var(--text-primary);
        }

        .message-row.user .message-bubble {
            margin-left: auto;
        }

        .message-row.assistant .message-bubble {
            width: 100%;
        }

        .message-rich-card {
            background: #f8f9fb;
            border: 1px solid #e0e3ea;
            border-radius: 20px;
            padding: 16px;
            display: inline-block;
            max-width: 520px;
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
        }

        .message-row.user .message-rich-card {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.12), rgba(59, 130, 246, 0.08));
            border-color: rgba(99, 102, 241, 0.25);
        }

        .message-rich-card.text-only-card {
            padding: 18px 20px;
        }

        .message-image-card img,
        .message-rich-card img {
            width: 100%;
            max-width: 320px;
            max-height: 260px;
            object-fit: contain;
            border-radius: 12px;
            display: block;
            background: #fff;
        }

        .message-image-caption {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #5f6368;
            margin-bottom: 8px;
        }

        .message-text {
            font-size: 14px;
            line-height: 1.6;
            color: inherit;
        }

        /* Markdown 内容样式 */
        .markdown-body p { margin-bottom: 12px; }
        .markdown-body ul, .markdown-body ol { margin-bottom: 12px; padding-left: 24px; }
        .markdown-body code { background: #f1f3f4; padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 0.9em; }
        .markdown-body pre { background: #1e1e1e; padding: 16px; border-radius: 8px; overflow-x: auto; margin-bottom: 12px; }
        .markdown-body pre code { background: transparent; color: #fff; padding: 0; }
        .markdown-body table { width: 100%; border-collapse: collapse; margin-bottom: 16px; }
        .markdown-body th, .markdown-body td { padding: 8px 12px; border: 1px solid #e0e0e0; font-size: 14px; }
        .markdown-body th { background: #f8f9fa; font-weight: 600; }
        .markdown-body strong { color: #000; font-weight: 600; }

        /* 思维链/搜索过程样式 */
        .thought-process {
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 16px;
            border: 1px solid #e0e0e0;
            overflow: hidden;
        }

        .thought-header {
            padding: 10px 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 500;
            background: #fff;
        }

        .thought-header:hover { background: #f1f3f4; }
        
        .thought-content {
            padding: 12px 16px;
            border-top: 1px solid #e0e0e0;
            font-size: 13px;
            color: #444;
            display: none;
        }
        
        .thought-content.open { display: block; }

        .step-item {
            margin-bottom: 8px;
            padding-left: 12px;
            border-left: 2px solid #ddd;
        }
        
        .step-tag {
            display: inline-block;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            margin-bottom: 4px;
            font-weight: 600;
        }
        .tag-google { background: #e8f0fe; color: #1967d2; }
        .tag-rag { background: #e6f4ea; color: #137333; }
        .tag-api { background: #fce8e6; color: #c5221f; }

        /* 底部来源信息 */
        .meta-info {
            margin-top: 12px;
            display: flex;
            gap: 8px;
            align-items: center;
            font-size: 12px;
            color: var(--text-secondary);
        }
        .source-chip {
            background: #fff;
            border: 1px solid #e0e0e0;
            padding: 4px 10px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .source-chip i { font-size: 14px; }

        /* 输入区域 (悬浮式) */
        .input-area {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(to top, var(--bg-color) 80%, rgba(240,244,249,0));
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            z-index: 50;
        }

        .input-box {
            background: #fff;
            width: 100%;
            max-width: 800px;
            border-radius: 32px;
            padding: 8px 16px;
            box-shadow: var(--shadow-float);
            display: flex;
            align-items: flex-end;
            gap: 12px;
            border: 1px solid transparent;
            transition: border 0.2s;
        }

        .input-box:focus-within {
            border-color: #d0d0d0;
        }

        textarea {
            flex: 1;
            border: none;
            background: transparent;
            padding: 14px 0;
            max-height: 150px;
            resize: none;
            outline: none;
            font-family: inherit;
            font-size: 16px;
            line-height: 1.5;
        }

        .action-btn {
            background: transparent;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.2s;
            margin-bottom: 4px;
        }

        .action-btn:hover { background: #f0f0f0; color: var(--primary-color); }
        
        .send-btn {
            background: var(--primary-color);
            color: #fff;
        }
        .send-btn:hover { background: #1a73e8; color: #fff; opacity: 0.9; }
        .send-btn:disabled { background: #dadce0; cursor: not-allowed; }

        /* Deep Search 开关 */
        .options-bar {
            position: absolute;
            bottom: 90px;
            display: flex;
            gap: 16px;
            font-size: 13px;
            color: var(--text-secondary);
            background: rgba(255,255,255,0.9);
            padding: 6px 12px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
            box-shadow: var(--shadow-sm);
        }

        .switch-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
        }

        /* Loading */
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 12px 0;
        }
        .typing-dot {
            width: 8px;
            height: 8px;
            background: linear-gradient(90deg, var(--gradient-start), var(--gradient-end));
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
            opacity: 0.6;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* 响应式 */
        @media (max-width: 600px) {
            .welcome-title { font-size: 32px; }
            .suggestion-grid { grid-template-columns: 1fr; }
            .message-bubble { max-width: 95%; }
        }

        /* 图片预览相关样式 */
        .image-preview-container {
            margin-bottom: 12px;
            padding: 12px;
            background: var(--chat-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-sm);
        }

        .image-preview {
            position: relative;
            display: inline-block;
            max-width: 200px;
            max-height: 200px;
        }

        .image-preview img {
            width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: var(--shadow-sm);
        }

        .remove-image-btn {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #ff4444;
            color: white;
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: var(--shadow-float);
            transition: all 0.2s ease;
        }

        .remove-image-btn:hover {
            background: #cc0000;
            transform: scale(1.1);
        }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="logo">
            <span class="material-icons-round" style="color: var(--primary-color)">auto_awesome</span>
            FullRAG
        </div>
        <div class="status-badge">
            <div class="dot" id="status-dot"></div>
            <span id="status-text">连接中...</span>
        </div>
    </div>

    <div class="chat-container" id="chatContainer">
        <div class="chat-content" id="chatContent">
            <div class="welcome-screen" id="welcomeScreen">
                <div class="welcome-title">你好，想查点什么？</div>
                <div style="color: var(--text-secondary); margin-bottom: 30px;">
                    集成了天气、交通、金融、Google 搜索和本地知识库的智能助手
                </div>
                
                <div class="suggestion-grid">
                    <div class="suggestion-card" onclick="setInput('今天香港的天气怎么样？')">
                        <span style="display:block; margin-bottom:4px">🌤️ 天气查询</span>
                        今天香港的天气怎么样？
                    </div>
                    <div class="suggestion-card" onclick="setInput('腾讯现在的股价是多少？')">
                        <span style="display:block; margin-bottom:4px">📈 金融数据</span>
                        腾讯现在的股价是多少？
                    </div>
                    <div class="suggestion-card" onclick="setInput('从坚尼地城到机场怎么去？')">
                        <span style="display:block; margin-bottom:4px">🚗 交通规划</span>
                        从坚尼地城到机场怎么去？
                    </div>
                    <div class="suggestion-card" onclick="setInput('OpenAI 最新发布的模型新闻')">
                        <span style="display:block; margin-bottom:4px">🌏 深度搜索</span>
                        OpenAI 最新发布的模型新闻
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="input-area">
        <div class="options-bar" id="optionsBar" style="display: flex;">
            <label class="switch-label">
                <input type="checkbox" id="useDeepSearch" checked style="accent-color: var(--primary-color)">
                <span class="material-icons-round" style="font-size: 16px;">psychology</span>
                深度思考模式 (自动回退)
            </label>
        </div>

        <!-- 添加图片预览区域 -->
        <div id="imagePreviewContainer" class="image-preview-container" style="display: none;">
            <div class="image-preview">
                <img id="imagePreview" src="" alt="预览图片">
                <button class="remove-image-btn" onclick="removeImage()" title="删除图片">
                    <span class="material-icons-round">close</span>
                </button>
            </div>
        </div>

        <!-- 修改现有的 input-box -->
        <div class="input-box">
            <!-- 修改附件按钮为文件输入 -->
            <input type="file" id="imageUpload" accept="image/*" style="display: none;">
            <button class="action-btn" title="上传图片" onclick="document.getElementById('imageUpload').click()">
                <span class="material-icons-round">add_circle_outline</span>
            </button>
            
            <!-- 现有的 textarea 和发送按钮 -->
            <textarea 
                id="queryInput" 
                placeholder="输入问题..." 
                rows="1"
                oninput="autoResize(this)"
                onkeydown="handleKeyDown(event)"
            ></textarea>
            <button class="action-btn send-btn" id="sendButton" onclick="sendQuery()">
                <span class="material-icons-round">arrow_upward</span>
            </button>
        </div>
    </div>

    <script>
        // 初始化 Markdown 配置
        marked.setOptions({
            highlight: function(code, lang) {
                const language = highlight.getLanguage(lang) ? lang : 'plaintext';
                return highlight.highlight(code, { language }).value;
            },
            langPrefix: 'hljs language-',
            breaks: true
        });

        let sessionId = null;
        let isProcessing = false;
        let imageData = null; // 添加图片相关变量

        // 自动调整输入框高度
        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 150) + 'px';
            
            // 隐藏/显示 Deep Search 选项
            const optionsBar = document.getElementById('optionsBar');
            if (textarea.value.length > 0) {
                optionsBar.style.display = 'none';
            } else {
                optionsBar.style.display = 'flex';
            }
        }

        function setInput(text) {
            const input = document.getElementById('queryInput');
            input.value = text;
            autoResize(input);
            input.focus();
            sendQuery();
        }

        function handleKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendQuery();
            }
        }

        // 添加图片上传处理函数
        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            // 验证文件类型
            if (!file.type.startsWith('image/')) {
                alert('请选择图片文件');
                return;
            }
            
            // 验证文件大小 (限制为10MB)
            if (file.size > 10 * 1024 * 1024) {
                alert('图片文件大小不能超过10MB');
                return;
            }
            
            const reader = new FileReader();
            reader.onload = function(e) {
                imageData = e.target.result; // Base64 数据URL格式
                
                // 显示预览
                const previewImg = document.getElementById('imagePreview');
                const previewContainer = document.getElementById('imagePreviewContainer');
                
                previewImg.src = imageData;
                previewContainer.style.display = 'block';
                
                // 更新输入框占位符
                document.getElementById('queryInput').placeholder = 
                    imageData ? "描述这张图片或提出问题..." : "输入问题...";
            };
            reader.readAsDataURL(file);
        }

        function removeImage() {
            imageData = null;
            document.getElementById('imageUpload').value = '';
            document.getElementById('imagePreviewContainer').style.display = 'none';
            document.getElementById('queryInput').placeholder = "输入问题...";
        }

        async function sendQuery() {
            const input = document.getElementById('queryInput');
            const query = input.value.trim();
            const outgoingImageData = imageData; // 发送前保存当前图像数据
            
            // 如果没有文本但有图片，允许发送
            if (!query && !outgoingImageData) return;
            if (isProcessing) return;

            // UI 状态更新
            document.getElementById('welcomeScreen').style.display = 'none';
            isProcessing = true;
            input.disabled = true;
            document.getElementById('sendButton').disabled = true;

            // 添加用户消息 (包含图片)
            appendMessage('user', query, outgoingImageData);
            
            // 清空输入
            input.value = '';
            input.style.height = 'auto';
            removeImage(); // 发送后清除图片预览

            // 添加 Loading 占位符
            const loadingId = appendLoading();

            try {
                const response = await fetch('/api/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        query: query || "请分析这张图片", // 如果只有图片，提供默认查询
                        language: 'Chinese',
                        session_id: sessionId,
                        use_deep_search: document.getElementById('useDeepSearch').checked,
                        image_data: outgoingImageData // 添加图片数据
                    })
                });

                if (!response.ok) throw new Error('Network error');
                const data = await response.json();
                sessionId = data.session_id;

                // 移除 Loading，显示回答
                removeMessage(loadingId);
                appendAssistantMessage(data);

            } catch (error) {
                removeMessage(loadingId);
                appendMessage('assistant', `❌ 出错了: ${error.message}`);
                console.error(error);
            } finally {
                isProcessing = false;
                input.disabled = false;
                document.getElementById('sendButton').disabled = false;
                input.focus();
                document.getElementById('optionsBar').style.display = 'flex';
            }
        }

        // 渲染消息
        function appendMessage(role, content, imageData = null) {
            const container = document.getElementById('chatContent');
            const div = document.createElement('div');
            div.className = `message-row ${role}`;
            
            // 头像
            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            if (role === 'user') {
                avatar.innerHTML = '<span class="material-icons-round" style="color:#5f6368">person</span>';
            } else {
                avatar.innerHTML = '<span class="material-icons-round" style="color:var(--primary-color)">auto_awesome</span>';
            }

            // 气泡
            const bubble = document.createElement('div');
            bubble.className = 'message-bubble markdown-body';
            
            const needsCard = imageData || role === 'user';

            if (needsCard) {
                const richCard = document.createElement('div');
                richCard.className = 'message-rich-card';

                if (!imageData) {
                    richCard.classList.add('text-only-card');
                    const caption = document.createElement('div');
                    caption.className = 'message-image-caption';
                    caption.textContent = '💬 用户提问';
                    richCard.appendChild(caption);
                } else {
                    const caption = document.createElement('div');
                    caption.className = 'message-image-caption';
                    caption.textContent = '📷 上传的图片';

                    const img = document.createElement('img');
                    img.src = imageData;
                    img.alt = role === 'user' ? '用户上传图片' : '图片';

                    richCard.appendChild(caption);
                    richCard.appendChild(img);
                }

                if (content) {
                    const textBlock = document.createElement('div');
                    textBlock.className = 'message-text';
                    textBlock.textContent = content;
                    textBlock.style.marginTop = imageData ? '12px' : '6px';
                    richCard.appendChild(textBlock);
                }

                bubble.appendChild(richCard);
            } else if (content) {
                const textBlock = document.createElement('div');
                textBlock.className = 'message-text';
                textBlock.textContent = content;
                bubble.appendChild(textBlock);
            }

            div.appendChild(avatar);
            div.appendChild(bubble);
            container.appendChild(div);
            scrollToBottom();
        }

        // 渲染 AI 复杂回答（包含思维链和来源）
        function appendAssistantMessage(data) {
            const container = document.getElementById('chatContent');
            const div = document.createElement('div');
            div.className = 'message-row assistant';

            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.innerHTML = '<span class="material-icons-round" style="color:var(--primary-color)">auto_awesome</span>';

            const contentDiv = document.createElement('div');
            contentDiv.style.flex = '1';
            contentDiv.style.maxWidth = '100%';

            // 1. 思维链 / 搜索过程 (如果有 attempt_history)
            if (data.attempt_history && data.attempt_history.length > 0) {
                const thoughtDiv = document.createElement('div');
                thoughtDiv.className = 'thought-process';
                
                const stepsCount = data.attempt_history.length;
                const headerText = `已完成 ${stepsCount} 步思考与搜索`;
                
                thoughtDiv.innerHTML = `
                    <div class="thought-header" onclick="this.nextElementSibling.classList.toggle('open')">
                        <div style="display:flex;align-items:center;gap:6px">
                            <span class="material-icons-round" style="font-size:16px">manage_search</span>
                            ${headerText}
                        </div>
                        <span class="material-icons-round">expand_more</span>
                    </div>
                    <div class="thought-content">
                        ${data.attempt_history.map(step => `
                            <div class="step-item">
                                <span class="step-tag tag-${getStrategyTag(step.source)}">${step.source}</span>
                                <div style="color:#666">${step.strategy === 'google' ? 'Google 搜索' : '知识库/API检索'}</div>
                                <div style="font-size:11px;color:#999;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">
                                    ${step.answer_preview || '无预览'}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
                contentDiv.appendChild(thoughtDiv);
            }

            // 2. 主要回答
            const bubble = document.createElement('div');
            bubble.className = 'message-bubble markdown-body';
            bubble.innerHTML = marked.parse(data.answer);
            contentDiv.appendChild(bubble);

            // 3. 底部元数据 (来源 & 耗时)
            const metaDiv = document.createElement('div');
            metaDiv.className = 'meta-info';
            
            const sourceIcon = getSourceIcon(data.source);
            const sourceName = getSourceLabel(data.source);
            
            // 计算总耗时
            let totalTime = 0;
            if (data.timing) {
                totalTime = Object.values(data.timing).reduce((a, b) => a + b, 0);
            }

            metaDiv.innerHTML = `
                <div class="source-chip">
                    <span class="material-icons-round">${sourceIcon}</span>
                    ${sourceName}
                </div>
                ${totalTime > 0 ? `<span style="margin-left:8px">⏱ ${totalTime.toFixed(2)}s</span>` : ''}
            `;
            contentDiv.appendChild(metaDiv);

            div.appendChild(avatar);
            div.appendChild(contentDiv);
            container.appendChild(div);
            scrollToBottom();
        }

        function appendLoading() {
            const id = 'loading-' + Date.now();
            const container = document.getElementById('chatContent');
            const div = document.createElement('div');
            div.id = id;
            div.className = 'message-row assistant';
            div.innerHTML = `
                <div class="avatar">
                    <span class="material-icons-round" style="color:var(--primary-color)">auto_awesome</span>
                </div>
                <div class="message-bubble">
                    <div class="typing-indicator">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    </div>
                </div>
            `;
            container.appendChild(div);
            scrollToBottom();
            return id;
        }

        function removeMessage(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function scrollToBottom() {
            const container = document.getElementById('chatContainer');
            container.scrollTop = container.scrollHeight;
        }

        // 辅助函数
        function getSourceIcon(source) {
            if (source === 'weather_api') return 'wb_sunny';
            if (source === 'traffic_api') return 'directions_car';
            if (source === 'finance_api') return 'trending_up';
            if (source === 'google_search_api') return 'public';
            if (source === 'rag') return 'library_books';
            return 'smart_toy';
        }

        function getSourceLabel(source) {
            const map = {
                'weather_api': '天气实况',
                'traffic_api': '交通规划',
                'finance_api': '市场数据',
                'google_search_api': '全网搜索',
                'rag': '知识库',
            };
            return map[source] || 'AI 模型';
        }

        function getStrategyTag(source) {
            if (source && source.includes('google')) return 'google';
            if (source && source.includes('rag')) return 'rag';
            return 'api';
        }

        // 健康检查
        async function checkHealth() {
            try {
                const res = await fetch('/api/health');
                const data = await res.json();
                const dot = document.getElementById('status-dot');
                const text = document.getElementById('status-text');
                
                if (data.status === 'healthy') {
                    dot.classList.add('active');
                    text.textContent = '系统在线';
                } else {
                    dot.classList.remove('active');
                    text.textContent = '服务异常';
                }
            } catch (e) {
                console.error('Health check failed', e);
            }
        }

        window.onload = checkHealth;
        setInterval(checkHealth, 30000);

        // 在页面加载时绑定事件
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('imageUpload').addEventListener('change', handleImageUpload);
        });
    </script>
</body>
</html>
